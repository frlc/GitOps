version: 0.2

env:
  variables:
    ENVIRONMENT: "dev"

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "Installing dependencies..."
      - pip install --quiet yamllint

  pre_build:
    commands:
      - echo "Running sanity checks on $(date)"
      - echo "Source version: ${CODEBUILD_RESOLVED_SOURCE_VERSION}"
      - yamllint -d relaxed .

  build:
    commands:
      - echo "Build started for environment ${ENVIRONMENT}"
      - echo "Hello from CodeBuild!"

  post_build:
    commands:
      - echo "Build finished with status ${CODEBUILD_BUILD_SUCCEEDING}"

artifacts:
  files:
    - '**/*'
  discard-paths: no
